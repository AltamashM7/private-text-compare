name: Apply Phase 1B typography correction

on:
  push:
    branches:
      - phase-1b/comparator-ui
    paths:
      - .github/workflows/vendor-geist-fonts.yml

permissions:
  contents: write

jobs:
  apply-correction:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-1b/comparator-ui

      - name: Reverify vendored Geist bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object public/fonts/geist/geist-sans-variable.woff2)" = '71dab8bedba3bfef5dccd7875ed05cac44c7345d'
          test "$(git hash-object public/fonts/geist/geist-mono-variable.woff2)" = '0e746fc18223dfcb107a85502a0abe1b1a02d51a'
          test "$(git hash-object public/fonts/geist/OFL.txt)" = '04e95fc550855eb44416b9db1f6722f5cb7342db'

      - name: Apply typography, canvas, provenance, and browser assertions
        shell: bash
        env:
          APPLY_SCRIPT_B64: " || true