name: Bootstrap Phase 1A lockfile

on:
  push:
    branches:
      - phase-1a/comparison-engine

permissions:
  contents: write

jobs:
  lockfile:
    name: Update comparison engine lockfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-1a/comparison-engine

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Generate npm lockfile
        run: npm install --package-lock-only

      - name: Install locked dependencies
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Run core unit tests
        run: npm run test:unit

      - name: Build static production output
        run: npm run build

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update npm lockfile for comparison engine"
          test "$(git branch --show-current)" = "phase-1a/comparison-engine"
          git push origin HEAD:phase-1a/comparison-engine
