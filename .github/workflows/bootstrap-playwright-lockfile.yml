name: Bootstrap Playwright lockfile

on:
  push:
    branches:
      - phase-0d/browser-qa-artifacts

permissions:
  contents: write

jobs:
  lockfile:
    name: Generate and validate Playwright lockfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-0d/browser-qa-artifacts
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate clean install
        run: npm ci

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build static production output
        run: npm run build

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update npm lockfile for Playwright"
          git push origin HEAD:phase-0d/browser-qa-artifacts
