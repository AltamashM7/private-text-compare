name: Temporary lockfile security refresh

on:
  push:
    branches:
      - maintenance/dependency-security-2026-10

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - id: ready
        shell: bash
        run: |
          if grep -Fq '"astro": "7.3.5"' package.json && grep -Fq '"wrangler": "4.147.0"' package.json && grep -Fq '"vitest": "4.1.11"' package.json; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.value == 'true'
        run: npm install --package-lock-only --ignore-scripts
      - if: steps.ready.outputs.value == 'true'
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - if: steps.ready.outputs.value == 'true'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for security updates"
          git push origin HEAD:maintenance/dependency-security-2026-10
      - if: steps.ready.outputs.value == 'true'
        run: npm audit
